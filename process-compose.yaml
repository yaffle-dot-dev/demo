version: "0.5"

log_location: .dev/logs/process-compose.log

processes:
  postgres:
    command: |
      if [ ! -d "$PGDATA" ]; then
        echo "Run ./scripts/dev-init.sh first to initialize postgres"
        exit 1
      fi
      # Run postgres in foreground (not as daemon)
      postgres -D "$PGDATA" -k /tmp -p 5432
    log_location: .dev/logs/postgres.log
    readiness_probe:
      exec:
        command: "pg_isready -h /tmp -p 5432 -d yaffle_dev"
      initial_delay_seconds: 2
      period_seconds: 5
      failure_threshold: 3

  caddy:
    command: "caddy run --config Caddyfile"
    log_location: .dev/logs/caddy.log
    depends_on:
      control-plane:
        condition: process_healthy
    readiness_probe:
      exec:
        command: "curl -sf --max-time 5 --resolve yaffle.local:6969:127.0.0.1 https://yaffle.local:6969/api/health > /dev/null"
      initial_delay_seconds: 5
      period_seconds: 10
      failure_threshold: 5

  control-plane:
    command: "./scripts/dev-control-plane.sh"
    log_location: .dev/logs/control-plane.log
    # depends_on:
    #   postgres:
    #     condition: process_healthy
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 3000
        path: "/api/health"
      initial_delay_seconds: 5
      period_seconds: 10
      failure_threshold: 3

  web:
    command: "dotenvx run -o -f env/dev/base.env -- vp run dev:web"
    log_location: .dev/logs/web.log
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 5173
        path: "/app/_/health"
      initial_delay_seconds: 5
      period_seconds: 10
      failure_threshold: 3

  marketing:
    command: "vp run dev:mlp"
    log_location: .dev/logs/marketing.log
    readiness_probe:
      exec:
        command: "curl -sf http://localhost:4000/ > /dev/null"
      initial_delay_seconds: 5
      period_seconds: 10
      failure_threshold: 3

  docs:
    command: |
      vp run @yaffle/docs#build
      echo "Watching for changes..."
      watchexec -w apps/docs/src -w apps/docs/astro.config.mjs -e mdx,md,astro,css,ts,js -- vp run @yaffle/docs#build
    log_location: .dev/logs/docs.log
    readiness_probe:
      exec:
        command: "test -f apps/docs/dist/index.html"
      initial_delay_seconds: 5
      period_seconds: 10
      failure_threshold: 3

  smee:
    command: |
      dotenvx run -o -f env/dev/base.env -- bash -lc 'vp exec smee-client --url "$SMEE_URL" --target http://localhost:3000/api/webhooks/github'
    log_location: .dev/logs/smee.log
    depends_on:
      caddy:
        condition: process_healthy
    readiness_probe:
      exec:
        command: "pgrep -f smee-client"
      period_seconds: 10
      failure_threshold: 3

  # opencode:

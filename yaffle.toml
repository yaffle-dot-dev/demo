version = 1

# =============================================================================
# Environments
# =============================================================================
# Named, long-lived deployment targets

[[environments]]
name = "main"

# =============================================================================
# Triggers
# =============================================================================

# Deploy to main environment when main branch is pushed
[[triggers.github.push]]
ref_patterns = ["refs/heads/main"]
environment = "main"

# Create transient environments for all pull requests
[[triggers.github.pull_request]]
branch_patterns = ["*"]

# =============================================================================
# Workspaces
# =============================================================================

# ---------------------------------------------------------------------------
# Core Infrastructure (shared, production, nonprod)
# ---------------------------------------------------------------------------
# These are foundational - changes here affect all applications.

[[workspaces]]
path = "infra/shared"
environments = ["main"]
variables.cloudflare_zone_id = "ba87a43c4698d9a9ca066c62311445b6"
variables.stripe_webhook_url = "https://yaffle.dev/api/webhooks/stripe"

[[workspaces]]
path = "infra/production"
environments = ["main"]

[[workspaces]]
path = "infra/nonprod"
environments = ["main"]

# ---------------------------------------------------------------------------
# Application Infrastructure
# ---------------------------------------------------------------------------

[[workspaces]]
path = "apps/control-plane/infra"
environments = ["*"]
variables.private_beta_invites_required = true
variables.private_beta_operator_identifiers = "dev@launi.me"

[[workspaces]]
path = "apps/runner/infra"
environments = ["*"]
variables.runner_cpu    = 512
variables.runner_memory = 1024
# ---------------------------------------------------------------------------
# App S3 Buckets (owned by individual apps)
# ---------------------------------------------------------------------------
# These create the S3 buckets for each app. They must be applied before
# apps/infra which references their outputs for CloudFront configuration.

[[workspaces]]
path = "apps/marketing/infra"
environments = ["*"]

[[workspaces]]
path = "apps/docs/infra"
environments = ["*"]

[[workspaces]]
path = "apps/web/infra"
environments = ["*"]

[[workspaces]]
path = "apps/provider-discovery-agent/infra"
environments = ["*"]

# ---------------------------------------------------------------------------
# Unified Frontend (CloudFront + routing)
# ---------------------------------------------------------------------------
# This creates the CloudFront distribution that routes to all app buckets.
# Depends on apps/marketing/infra and apps/web/infra outputs.

[[workspaces]]
path = "apps/infra"
environments = ["*"]
variables.cloudflare_zone_id = "ba87a43c4698d9a9ca066c62311445b6"

# ---------------------------------------------------------------------------
# Unified Frontend (CloudFront + routing)
# ---------------------------------------------------------------------------
# This creates the CloudFront distribution that routes to all app buckets.
# Depends on apps/marketing/infra and apps/web/infra outputs.

[[workspaces]]
path = "apps/infra"
environments = ["*"]
outputs.site_url = { visibility = "internal" }
outputs.cloudfront_distribution_id = { visibility = "internal" }
outputs.invalidation_role_arn = { visibility = "internal" }

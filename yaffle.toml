# Test-only integration-control proof against Environments PR #256.
# Do not merge: only disposable, credential-free preview workspaces are selected.

version = 1

[cloud]

[[cloud.triggers.github.pull_request]]
branch_patterns = ["*"]

[[workspaces]]
path = "infra/app"
environments = ["*"]
variables.environment = "{{ environment }}"
variables.min_instances = 2
variables.max_instances = 5
variables.enable_debug = false

[[workspaces]]
path = "infra/preview-isolation"
environments = ["*"]
automatic_preview_isolation = true
variables.resource_name = "yaffle-product-demo"
variables.environment = "{{ environment }}"
variables.demo_message = "Updated through NONPROD Integration Control; PR256 must advance the existing state"

# Yaffle local-only orchestration demo

version = 1

[[environments]]
name = "production"

[[environments]]
name = "staging"

[[environments]]
name = "development"

[[environments]]
name = "handoff-candidate-262-v2"

[[environments]]
name = "handoff-control-261-v2"

[cloud]

[[cloud.triggers.github.push]]
ref_patterns = ["refs/heads/main"]
environment = "production"

[[cloud.triggers.github.push]]
ref_patterns = ["refs/heads/staging"]
environment = "staging"

[[cloud.triggers.github.push]]
ref_patterns = ["refs/heads/develop"]
environment = "development"

[[cloud.triggers.github.push]]
ref_patterns = ["refs/heads/acceptance/handoff-candidate-262"]
environment = "handoff-candidate-262-v2"

[[cloud.triggers.github.push]]
ref_patterns = ["refs/heads/acceptance/handoff-control-261"]
environment = "handoff-control-261-v2"

[[cloud.triggers.github.pull_request]]
branch_patterns = ["*"]

# Local fixtures execute automatically in every environment, including production.
# Change all six test_revision values together for each serial push (A, B, C).

[[workspaces]]
path = "infra/core"
environments = ["*"]
variables.test_revision = "paired-20261114-A"
variables.delay_seconds = 2
variables.project_name = "yaffle-demo"
variables.enable_monitoring = true
variables.retention_days = 30

[[workspaces]]
path = "infra/database"
environments = ["*"]
depends_on = ["infra/core"]
variables.test_revision = "paired-20261114-A"
variables.delay_seconds = 60
variables.instance_count = 3
variables.enable_backups = true

[[workspaces]]
path = "infra/app"
environments = ["*"]
depends_on = ["infra/database", "infra/feature-flags"]
variables.test_revision = "paired-20261114-A"
variables.delay_seconds = 3
variables.min_instances = 1
variables.max_instances = 5
variables.enable_debug = false

[[workspaces]]
path = "infra/feature-flags"
environments = ["*"]
depends_on = ["infra/core"]
variables.test_revision = "paired-20261114-A"
variables.delay_seconds = 3

[[workspaces]]
path = "infra/sandbox"
environments = ["*"]
variables.test_revision = "paired-20261114-A"
variables.delay_seconds = 10
variables.sandbox_mode = true

[[workspaces]]
path = "infra/preview-isolation"
environments = ["*"]
depends_on = ["infra/app"]
variables.test_revision = "paired-20261114-A"
variables.delay_seconds = 2
automatic_preview_isolation = true
variables.resource_name = "yaffle-product-demo"
variables.environment = "{{ environment }}"
variables.demo_message = "Automatic preview isolation is live"

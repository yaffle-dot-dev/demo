name = "yaffle-provider-discovery-agent"
main = "src/index.ts"
compatibility_date = "2026-03-23"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "ProviderDiscoveryAgent"
class_name = "ProviderDiscoveryAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProviderDiscoveryAgent"]

[vars]
YAFFLE_PROVIDER_DISCOVERY_CALLBACK_TIMEOUT_MS = "8000"
YAFFLE_PROVIDER_DISCOVERY_MAX_DOCS = "24"
YAFFLE_PROVIDER_DISCOVERY_AI_MODEL = "@cf/zai-org/glm-4.7-flash"
YAFFLE_PROVIDER_DISCOVERY_AI_GATEWAY_ID = "yaffle-provider-discovery"

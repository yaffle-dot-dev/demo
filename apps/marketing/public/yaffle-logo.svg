<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Tessellated Yaffle (Green Woodpecker) - Profile View -->
  
  <!-- Body - main green mass -->
  <polygon points="20,52 28,58 40,56 48,48 44,36 36,32 28,36 20,44" fill="#6da323"/>
  <polygon points="28,36 36,32 40,24 32,20 24,28" fill="#8bc431"/>
  <polygon points="36,32 44,36 48,28 40,24" fill="#537c1e"/>
  
  <!-- Head - lighter green -->
  <polygon points="24,28 32,20 36,12 28,10 20,18" fill="#a8db4f"/>
  <polygon points="32,20 40,24 44,16 36,12" fill="#8bc431"/>
  
  <!-- Crown - red crest -->
  <polygon points="28,10 36,12 40,6 32,4 24,8" fill="#fa2d2d"/>
  <polygon points="36,12 44,16 46,10 40,6" fill="#c30b0b"/>
  
  <!-- Beak - pointed, angled down slightly -->
  <polygon points="20,18 24,28 16,28 8,24 10,20" fill="#a1887f"/>
  <polygon points="10,20 8,24 4,22 6,18" fill="#8d6e63"/>
  
  <!-- Eye - white ring with dark center -->
  <polygon points="26,20 30,18 32,22 28,24" fill="#1d2e0a"/>
  <polygon points="27,21 29,19 30,21 28,23" fill="#ffffff"/>
  <circle cx="28.5" cy="21" r="1.5" fill="#1d2e0a"/>
  
  <!-- Wing detail - darker green facets -->
  <polygon points="32,40 40,38 44,44 36,48" fill="#537c1e"/>
  <polygon points="36,48 44,44 48,48 42,52" fill="#44621d"/>
  
  <!-- Tail - dark with white bars hint -->
  <polygon points="42,52 48,48 56,54 52,58 44,56" fill="#1d2e0a"/>
  <polygon points="46,54 50,52 52,55 48,56" fill="#3a531c"/>
  
</svg>

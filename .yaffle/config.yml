version: 1

workspaces:
  # ==========================================================================
  # Core Infrastructure (shared, production, nonprod)
  # ==========================================================================
  # These are foundational - changes here affect all applications.
  # auto_apply: false means plan only on PR, apply on merge to main.
  
  - path: infra/shared
    auto_apply: false
    auto_apply_on_merge: true
    variables:
      cloudflare_zone_id: "ba87a43c4698d9a9ca066c62311445b6"

  - path: infra/production
    auto_apply: false
    auto_apply_on_merge: true

  - path: infra/nonprod
    auto_apply: false
    auto_apply_on_merge: true

  # ==========================================================================
  # Application Infrastructure
  # ==========================================================================
  # TODO: Uncomment after core infra is deployed (PR2)
  # Depends on module outputs from infra/shared, infra/production, infra/nonprod

  - path: apps/control-plane/infra
    auto_apply: true
    auto_apply_on_merge: true
    variables:
      secrets_arn_prefix: "arn:aws:secretsmanager:us-east-1:870923192739:secret:yaffle"

  # ---------------------------------------------------------------------------
  # App S3 Buckets (owned by individual apps)
  # ---------------------------------------------------------------------------
  # These create the S3 buckets for each app. They must be applied before
  # apps/infra which references their outputs for CloudFront configuration.

  - path: apps/marketing/infra
    auto_apply: true
    auto_apply_on_merge: true

  - path: apps/web/infra
    auto_apply: true
    auto_apply_on_merge: true

  # ---------------------------------------------------------------------------
  # Unified Frontend (CloudFront + routing)
  # ---------------------------------------------------------------------------
  # This creates the CloudFront distribution that routes to all app buckets.
  # Depends on apps/marketing/infra and apps/web/infra outputs.

  - path: apps/infra
    auto_apply: true
    auto_apply_on_merge: true
    variables:
      domain: "yaffle.dev"

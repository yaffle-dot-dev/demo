version: 1

workspaces:
  # ==========================================================================
  # Core Infrastructure (shared, production, nonprod)
  # ==========================================================================
  # These are foundational - changes here affect all applications.
  # auto_apply: false means plan only on PR, apply on merge to main.
  
  - path: infra/shared
    auto_apply: false
    auto_apply_on_merge: true
    variables:
      environment: "{{ env }}"
      aws_region: "us-east-1"
      cloudflare_zone_id: "ba87a43c4698d9a9ca066c62311445b6"

  - path: infra/production
    auto_apply: false
    auto_apply_on_merge: true
    variables:
      environment: "{{ env }}"
      aws_region: "us-east-1"

  - path: infra/nonprod
    auto_apply: false
    auto_apply_on_merge: true
    variables:
      environment: "{{ env }}"
      aws_region: "us-east-1"

  # ==========================================================================
  # Application Infrastructure
  # ==========================================================================

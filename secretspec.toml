[project]
name = "yaffle"
revision = "1.0"

# ── Default profile ──────────────────────────────────────────────
# All secrets required for the application to run. Other profiles
# inherit these and may relax requirements or add defaults.

[profiles.default]
GITHUB_APP_ID = { description = "GitHub App ID for webhook integration" }
GITHUB_APP_PRIVATE_KEY = { description = "GitHub App private key (PEM)", as_path = true }
GITHUB_WEBHOOK_SECRET = { description = "GitHub webhook HMAC secret" }
DATABASE_URL = { description = "PostgreSQL connection string" }
AWS_ACCESS_KEY_ID = { description = "AWS access key for S3 state, ECS, Secrets Manager" }
AWS_SECRET_ACCESS_KEY = { description = "AWS secret key" }
AWS_REGION = { description = "AWS region", required = false, default = "us-east-1" }

# ── Development profile ──────────────────────────────────────────
# Relaxed requirements with safe local defaults where possible.

[profiles.development]
DATABASE_URL = { default = "postgresql://yaffle@localhost:5432/yaffle_dev" }
AWS_ACCESS_KEY_ID = { required = false }
AWS_SECRET_ACCESS_KEY = { required = false }
GITHUB_APP_ID = { required = false }
GITHUB_APP_PRIVATE_KEY = { required = false }
GITHUB_WEBHOOK_SECRET = { required = false, type = "hex", generate = { bytes = 32 } }

# ── Test profile ─────────────────────────────────────────────────

[profiles.test]
DATABASE_URL = { default = "postgresql://yaffle@localhost:5432/yaffle_test" }
AWS_ACCESS_KEY_ID = { required = false }
AWS_SECRET_ACCESS_KEY = { required = false }
GITHUB_APP_ID = { required = false, default = "12345" }
GITHUB_APP_PRIVATE_KEY = { required = false }
GITHUB_WEBHOOK_SECRET = { required = false, default = "test-webhook-secret" }

# ── Production profile ───────────────────────────────────────────
# Everything required, no defaults. Provider overrides should be
# configured per-user via `secretspec config`.

[profiles.production]

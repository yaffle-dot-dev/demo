name: Check Outputs Action Sync

on:
  pull_request:
    paths:
      - "actions/outputs-action/**"
      - ".github/workflows/check-outputs-action-sync.yml"
      - "scripts/check-project-sync.sh"
  workflow_dispatch:

jobs:
  guard:
    name: Guard public sync state
    runs-on: ubuntu-latest
    steps:
      - name: Check out monorepo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check pending public outputs-action changes
        env:
          PROJECT: outputs-action
          SOURCE_PATH: actions/outputs-action
          TARGET_REPOSITORY: yaffle-dot-dev/outputs-action
          TARGET_BRANCH: main
        run: bash scripts/check-project-sync.sh

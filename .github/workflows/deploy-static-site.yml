# Reusable workflow for deploying static sites to S3 + CloudFront
# Called by marketing and docs deploy workflows

name: Deploy Static Site

on:
  workflow_call:
    inputs:
      site-name:
        description: "Site name (marketing, docs)"
        required: true
        type: string
      app-path:
        description: "Path to the app directory"
        required: true
        type: string
      build-command:
        description: "Build command to run"
        required: false
        type: string
        default: "bun run build"
      dist-path:
        description: "Path to built assets relative to app-path"
        required: false
        type: string
        default: "dist"
      s3-prefix:
        description: "Prefix path in S3 bucket (empty for root, 'docs' for /docs/)"
        required: false
        type: string
        default: ""
      site-infra-workspace:
        description: "Yaffle workspace for site's own infra (S3 buckets)"
        required: true
        type: string
      frontend-infra-workspace:
        description: "Yaffle workspace for frontend infra (CloudFront)"
        required: false
        type: string
        default: "apps/infra"
      yaffle-api-url:
        description: "Yaffle API base URL for preview output lookups"
        required: false
        type: string
        default: "http://yaffle.tail66f312.ts.net:3000"
      tailscale-ping-target:
        description: "Tailnet host to verify after connecting GitHub Actions to Tailscale"
        required: false
        type: string
        default: "yaffle.tail66f312.ts.net"
    secrets:
      AWS_REGION:
        required: false

env:
  AWS_REGION: us-east-1
  YAFFLE_GITHUB_ACTIONS_CI_ROLE_ARN: arn:aws:iam::870923192739:role/yaffle-github-actions-ci
  TAILSCALE_GITHUB_ACTIONS_SECRET_ID: yaffle/shared/tailscale/github-actions-oauth

jobs:
  deploy:
    name: Deploy ${{ inputs.site-name }}
    runs-on: depot-ubuntu-24.04

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Configure AWS credentials (bootstrap)
        if: inputs.tailscale-ping-target != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.YAFFLE_GITHUB_ACTIONS_CI_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || env.AWS_REGION }}

      - name: Fetch Tailscale GitHub Actions OAuth credentials
        if: inputs.tailscale-ping-target != ''
        id: tailscale-bootstrap
        run: |
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "${TAILSCALE_GITHUB_ACTIONS_SECRET_ID}" \
            --query SecretString \
            --output text)

          echo "oauth-client-id=$(printf '%s' "$SECRET_JSON" | jq -r '.oauth_client_id')" >> "$GITHUB_OUTPUT"
          echo "oauth-secret=$(printf '%s' "$SECRET_JSON" | jq -r '.oauth_secret')" >> "$GITHUB_OUTPUT"

      - name: Connect GitHub Actions runner to Tailscale
        if: inputs.tailscale-ping-target != ''
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ steps.tailscale-bootstrap.outputs.oauth-client-id }}
          oauth-secret: ${{ steps.tailscale-bootstrap.outputs.oauth-secret }}
          tags: tag:github-actions-ci
          ping: ${{ inputs.tailscale-ping-target }}
          version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Load Yaffle API token from Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            YAFFLE_API_TOKEN, yaffle/shared/github-actions/yaffle-api-token
          parse-json-secrets: false

      - name: Build site
        run: ${{ inputs.build-command }}
        working-directory: ${{ inputs.app-path }}

      - name: Wait for site infrastructure
        id: site-infra
        uses: ./actions/outputs-action
        with:
          api-url: ${{ inputs.yaffle-api-url }}
          workspace: ${{ inputs.site-infra-workspace }}
          wait: true
          wait-timeout: 600

      - name: Wait for frontend infrastructure
        id: frontend-infra
        uses: ./actions/outputs-action
        with:
          api-url: ${{ inputs.yaffle-api-url }}
          workspace: ${{ inputs.frontend-infra-workspace }}
          wait: true
          wait-timeout: 600

      - name: Configure AWS credentials (S3 deploy)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.site-infra.outputs.deploy_role_arn }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Sync to S3
        run: |
          if [ -n "${{ inputs.s3-prefix }}" ]; then
            aws s3 sync ${{ inputs.app-path }}/${{ inputs.dist-path }} \
              s3://${{ steps.site-infra.outputs.primary_bucket_name }}/${{ inputs.s3-prefix }} \
              --delete
          else
            aws s3 sync ${{ inputs.app-path }}/${{ inputs.dist-path }} \
              s3://${{ steps.site-infra.outputs.primary_bucket_name }} \
              --delete
          fi

      # TODO: Re-enable once CloudFront is deployed
      - name: Configure AWS credentials (CloudFront invalidation)
        if: steps.frontend-infra.outputs.cloudfront_distribution_id != 'PLACEHOLDER'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.frontend-infra.outputs.invalidation_role_arn }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Invalidate CloudFront cache
        if: steps.frontend-infra.outputs.cloudfront_distribution_id != 'PLACEHOLDER'
        run: |
          if [ -n "${{ inputs.s3-prefix }}" ]; then
            aws cloudfront create-invalidation \
              --distribution-id ${{ steps.frontend-infra.outputs.cloudfront_distribution_id }} \
              --paths "/${{ inputs.s3-prefix }}/*"
          else
            aws cloudfront create-invalidation \
              --distribution-id ${{ steps.frontend-infra.outputs.cloudfront_distribution_id }} \
              --paths "/*"
          fi

      - name: Summary
        run: |
          echo "## Deployed ${{ inputs.site-name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.frontend-infra.outputs.site_url }}${{ inputs.s3-prefix && format('/{0}/', inputs.s3-prefix) || '' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Bucket:** ${{ steps.site-infra.outputs.primary_bucket_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Distribution:** ${{ steps.frontend-infra.outputs.cloudfront_distribution_id }}" >> $GITHUB_STEP_SUMMARY

# Continuous Integration workflow
#
# Runs tests, type checking, and linting on every push and PR.
#
# Jobs:
# - check: Type checking and linting (fast, no external deps)
# - test: Unit tests (requires Postgres)
# - integration-test: TFC integration tests (requires AWS S3)

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Shared environment variables
env:
  # AWS region for integration tests
  AWS_REGION: us-east-1

jobs:
  check:
    name: Type check & lint
    runs-on: depot-ubuntu-24.04
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Set up FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Install dependencies
        run: |
          nix run github:cachix/devenv/v2.0.2 -- shell \
            --secretspec-provider dotenv \
            --secretspec-profile ci \
            -- bun install --frozen-lockfile

      - name: Type check
        run: |
          nix run github:cachix/devenv/v2.0.2 -- shell \
            --secretspec-provider dotenv \
            --secretspec-profile ci \
            -- bun run typecheck

      - name: Lint
        run: |
          nix run github:cachix/devenv/v2.0.2 -- shell \
            --secretspec-provider dotenv \
            --secretspec-profile ci \
            -- bun run lint

  test:
    name: Unit tests
    runs-on: depot-ubuntu-24.04
    permissions:
      id-token: write
      contents: read

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: yaffle
          POSTGRES_DB: yaffle_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Set up FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Install dependencies
        run: |
          nix run github:cachix/devenv/v2.0.2 -- shell \
            --secretspec-provider dotenv \
            --secretspec-profile ci \
            -- bun install --frozen-lockfile

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://yaffle@localhost:5432/yaffle_test
        run: |
          # Run tests excluding TFC integration tests (those need AWS)
          nix run github:cachix/devenv/v2.0.2 -- shell \
            --secretspec-provider dotenv \
            --secretspec-profile ci \
            -- bun test --testNamePattern "^(?!.*TFC|.*State Versions|.*Module Registry)"

  integration-test:
    name: Integration tests
    runs-on: depot-ubuntu-24.04
    # Only run on main branch or when explicitly requested
    # Integration tests use real AWS resources and cost money
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'run-integration-tests')
    permissions:
      id-token: write
      contents: read

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: yaffle
          POSTGRES_DB: yaffle_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Set up FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: |
          nix run github:cachix/devenv/v2.0.2 -- shell \
            --secretspec-provider dotenv \
            --secretspec-profile ci \
            -- bun install --frozen-lockfile

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://yaffle@localhost:5432/yaffle_test
        run: |
          nix run github:cachix/devenv/v2.0.2 -- shell \
            --secretspec-provider dotenv \
            --secretspec-profile ci \
            -- bun run db:migrate
        working-directory: apps/control-plane

      - name: Run TFC integration tests
        env:
          DATABASE_URL: postgresql://yaffle@localhost:5432/yaffle_test
          # Use outputs from Yaffle, or fall back to secrets for bootstrap
          YAFFLE_STATE_BUCKET: ${{ steps.infra.outputs.state_bucket_name || secrets.YAFFLE_STATE_BUCKET }}
          YAFFLE_TFC_API_HOST: localhost:6969
          # Generate a test secret for Better Auth
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'test-ci-secret-at-least-32-characters-long' }}
        run: |
          # Run only TFC integration tests
          nix run github:cachix/devenv/v2.0.2 -- shell \
            --secretspec-provider dotenv \
            --secretspec-profile ci \
            -- bun test apps/control-plane/src/routes/tfc/tfc.integration.test.ts

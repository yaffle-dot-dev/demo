name: Traffic Controller PR Comments

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      comment_body:
        description: "Comment command to simulate"
        required: true
        type: string
      actor_login:
        description: "Actor login"
        required: true
        type: string
      actor_id:
        description: "Actor GitHub user id"
        required: true
        type: string
      pr_number:
        description: "Pull request number"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

jobs:
  lease-comment:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/yaffle lease '))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out monorepo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.YAFFLE_APP_DEPLOYER_ROLE_ARN }}
          aws-region: us-east-1

      - name: Parse traffic-controller comment
        id: parse
        env:
          TRAFFIC_CONTROLLER_COMMENT_BODY: ${{ github.event_name == 'workflow_dispatch' && inputs.comment_body || github.event.comment.body }}
        run: |
          pnpm exec tsx scripts/parse-traffic-controller-comment.ts >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token for target repo
        id: target-app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.YAFFLE_INTERNAL_GH_APP_ID }}
          private-key: ${{ secrets.YAFFLE_INTERNAL_GH_APP_PRIVATE_KEY }}
          owner: ${{ steps.parse.outputs.repository_owner }}
          repositories: ${{ steps.parse.outputs.repository_name }}

      - name: Resolve target repository id
        id: repo
        env:
          GH_TOKEN: ${{ steps.target-app-token.outputs.token }}
          REPOSITORY_OWNER: ${{ steps.parse.outputs.repository_owner }}
          REPOSITORY_NAME: ${{ steps.parse.outputs.repository_name }}
        run: |
          repo_id="$(gh api "repos/${REPOSITORY_OWNER}/${REPOSITORY_NAME}" --jq '.id')"
          echo "id=${repo_id}" >> "$GITHUB_OUTPUT"

      - name: Run traffic-controller comment flow
        env:
          GH_TOKEN: ${{ github.token }}
          TRAFFIC_CONTROLLER_FUNCTION_NAME: ${{ vars.YAFFLE_TC_API_FUNCTION || 'yaffle-traffic-controller-api-main-use1' }}
          TRAFFIC_CONTROLLER_REPOSITORY: ${{ github.repository }}
          TRAFFIC_CONTROLLER_COMMENT_BODY: ${{ github.event_name == 'workflow_dispatch' && inputs.comment_body || github.event.comment.body }}
          TRAFFIC_CONTROLLER_ACTOR_LOGIN: ${{ github.event_name == 'workflow_dispatch' && inputs.actor_login || github.event.comment.user.login }}
          TRAFFIC_CONTROLLER_ACTOR_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.actor_id || github.event.comment.user.id }}
          TRAFFIC_CONTROLLER_PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.issue.number }}
          TRAFFIC_CONTROLLER_COMMENT_ID: ${{ github.event_name == 'workflow_dispatch' && format('workflow-dispatch-{0}', github.run_id) || github.event.comment.id }}
          TRAFFIC_CONTROLLER_TARGET_INSTALLATION_ID: ${{ steps.target-app-token.outputs.installation-id }}
          TRAFFIC_CONTROLLER_TARGET_REPOSITORY_ID: ${{ steps.repo.outputs.id }}
        run: pnpm exec tsx scripts/traffic-controller-pr-comment.ts

# Marketing Site Deployment
#
# Builds the Astro marketing site and deploys to S3/CloudFront.
# Uses the same deploy script as local deploys (scripts/deploy-marketing.ts).
#
# Flow:
# 1. Wait for Yaffle to provision infrastructure
# 2. Build Astro site with correct domain
# 3. Sync to S3, invalidate CloudFront
#
# Local equivalent:
#   nix run .#deploy-marketing -- --pr 123
#   nix run .#deploy-marketing -- --production

name: Marketing

on:
  push:
    branches: [main]
    paths:
      - "apps/marketing/**"
      - "packages/design/**"
      - "scripts/deploy-marketing.ts"
      - ".github/workflows/marketing.yml"
  pull_request:
    paths:
      - "apps/marketing/**"
      - "apps/marketing/infra/**"
      - "apps/infra/**"
      - "packages/design/**"
      - "scripts/deploy-marketing.ts"
      - ".github/workflows/marketing.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Build & Deploy
    runs-on: depot-ubuntu-24.04
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Set up FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Install dependencies
        run: nix develop --command bun install --frozen-lockfile

      - name: Deploy (PR preview)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          nix develop --command bun run scripts/deploy-marketing.ts \
            --pr ${{ github.event.pull_request.number }}

      - name: Deploy (main)
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          nix develop --command bun run scripts/deploy-marketing.ts --env main

      # Post preview URL as PR comment
      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            // Get the site URL from Yaffle outputs
            const { execSync } = require('child_process');
            const result = JSON.parse(execSync(
              `nix develop --command bun run packages/cli/src/outputs.ts --pr ${{ github.event.pull_request.number }} --workspace apps/infra --format json`,
              { encoding: 'utf8', env: { ...process.env, GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' } }
            ));
            const siteUrl = result.outputs?.site_url?.value || 'unknown';

            const body = `## Marketing Site Preview

            Your changes have been deployed to: **${siteUrl}**

            The site will be available once CloudFront propagates the changes (usually 1-2 minutes).

            <details>
            <summary>Deploy locally</summary>

            \`\`\`bash
            nix run .#deploy-marketing -- --pr ${{ github.event.pull_request.number }}
            \`\`\`
            </details>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Marketing Site Preview')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

name: Publish CLI

on:
  push:
    branches:
      - main
    paths:
      - "packages/cli/**"
      - ".github/workflows/publish-cli.yml"
      - "scripts/check-project-sync.sh"
      - "scripts/export-project.sh"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the standalone tree sync without pushing"
        required: false
        type: boolean
        default: true

jobs:
  publish:
    name: Publish CLI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: publish-cli-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Check out monorepo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create source repo GitHub App token
        id: app-token
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.YAFFLE_INTERNAL_GH_APP_ID }}
          private-key: ${{ secrets.YAFFLE_INTERNAL_GH_APP_PRIVATE_KEY }}
          owner: yaffle-dot-dev
          repositories: cli

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Sync CLI to public repo
        env:
          PROJECT: cli
          SOURCE_PATH: packages/cli
          TARGET_REPOSITORY: yaffle-dot-dev/cli
          TARGET_BRANCH: main
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          PUBLISH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash scripts/export-project.sh

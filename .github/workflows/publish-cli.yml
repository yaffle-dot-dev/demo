name: Publish CLI

on:
  push:
    branches:
      - main
    paths:
      - "packages/cli/**"
      - "packages/yaffle-client/**"
      - ".github/workflows/publish-cli.yml"
      - ".github/workflows/publish-project.yml"
      - "publishing/templates/cli/**"
      - "scripts/publish-project.sh"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the split and standalone tree without pushing"
        required: false
        type: boolean
        default: true

jobs:
  publish:
    uses: ./.github/workflows/publish-project.yml
    with:
      project: cli
      source_path: packages/cli
      target_repository: yaffle-dot-dev/cli
      target_branch: main
      push_mode: force
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    secrets:
      yaffle_internal_gh_app_id: ${{ secrets.YAFFLE_INTERNAL_GH_APP_ID }}
      yaffle_internal_gh_app_private_key: ${{ secrets.YAFFLE_INTERNAL_GH_APP_PRIVATE_KEY }}

# Nix Flake CI
#
# Uses Determinate CI to build and cache all flake outputs.
# This runs on Depot runners with FlakeHub Cache for fast, cached Nix builds.
#
# What this builds (auto-discovered from flake.nix):
# - packages.*.control-plane (the Bun app)
# - packages.*.control-plane-image (OCI container)
# - devShells.*.default

name: Nix

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v?[0-9]+.[0-9]+.[0-9]+*

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  DeterminateCI:
    uses: DeterminateSystems/ci/.github/workflows/workflow.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      # Use Depot runners for faster builds
      runner-map: |
        {
          "x86_64-linux": "depot-ubuntu-24.04",
          "aarch64-linux": "depot-ubuntu-24.04-arm",
          "aarch64-darwin": "macos-latest"
        }
      # Publish to FlakeHub on tags (optional, enable when ready)
      # visibility: unlisted

name: Check CLI Sync

on:
  pull_request:
    paths:
      - "packages/cli/**"
      - ".github/workflows/check-cli-sync.yml"
      - "scripts/check-project-sync.sh"
  workflow_dispatch:

jobs:
  guard:
    name: Guard public sync state
    runs-on: ubuntu-latest
    steps:
      - name: Check out monorepo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check pending public CLI changes
        env:
          PROJECT: cli
          SOURCE_PATH: packages/cli
          TARGET_REPOSITORY: yaffle-dot-dev/cli
          TARGET_BRANCH: main
        run: bash scripts/check-project-sync.sh

name: Import Public Project

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Public project to import from"
        required: true
        type: choice
        options:
          - cli
          - outputs-action
      source_branch:
        description: "Branch to import from"
        required: false
        type: string
        default: main

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    name: Import ${{ inputs.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out monorepo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve project config
        id: project
        shell: bash
        run: |
          case "${PROJECT}" in
            cli)
              echo "source_path=packages/cli" >> "$GITHUB_OUTPUT"
              echo "source_repository=yaffle-dot-dev/cli" >> "$GITHUB_OUTPUT"
              ;;
            outputs-action)
              echo "source_path=actions/outputs-action" >> "$GITHUB_OUTPUT"
              echo "source_repository=yaffle-dot-dev/outputs-action" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unsupported project: ${PROJECT}"
              exit 1
              ;;
          esac
        env:
          PROJECT: ${{ inputs.project }}

      - name: Resolve source repository
        id: source-repo
        shell: bash
        run: |
          owner="${SOURCE_REPOSITORY%%/*}"
          repo="${SOURCE_REPOSITORY#*/}"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
        env:
          SOURCE_REPOSITORY: ${{ steps.project.outputs.source_repository }}

      - name: Resolve monorepo repository
        id: monorepo-repo
        shell: bash
        run: |
          owner="${MONOREPO_REPOSITORY%%/*}"
          repo="${MONOREPO_REPOSITORY#*/}"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
        env:
          MONOREPO_REPOSITORY: ${{ github.repository }}

      - name: Create source repo GitHub App token
        id: source-app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.YAFFLE_INTERNAL_GH_APP_ID }}
          private-key: ${{ secrets.YAFFLE_INTERNAL_GH_APP_PRIVATE_KEY }}
          owner: ${{ steps.source-repo.outputs.owner }}
          repositories: ${{ steps.source-repo.outputs.repo }}

      - name: Create monorepo GitHub App token
        id: monorepo-app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.YAFFLE_INTERNAL_GH_APP_ID }}
          private-key: ${{ secrets.YAFFLE_INTERNAL_GH_APP_PRIVATE_KEY }}
          owner: ${{ steps.monorepo-repo.outputs.owner }}
          repositories: ${{ steps.monorepo-repo.outputs.repo }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install Bun
        if: inputs.project == 'cli'
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Import public changes
        id: import
        env:
          PROJECT: ${{ inputs.project }}
          SOURCE_PATH: ${{ steps.project.outputs.source_path }}
          SOURCE_REPOSITORY: ${{ steps.project.outputs.source_repository }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          IMPORT_TOKEN: ${{ steps.source-app-token.outputs.token }}
          MONOREPO_PUSH_TOKEN: ${{ steps.monorepo-app-token.outputs.token }}
          BRANCH_NAME: sync/import-${{ inputs.project }}
        run: bash scripts/import-project.sh

      - name: Find existing pull request
        if: steps.import.outputs.changed == 'true'
        id: existing-pr
        env:
          GH_TOKEN: ${{ steps.monorepo-app-token.outputs.token }}
          IMPORT_BRANCH: ${{ steps.import.outputs.branch_name }}
        run: |
          pr_number="$(gh pr list --state open --head "$IMPORT_BRANCH" --json number --jq '.[0].number // ""')"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.import.outputs.changed == 'true' && steps.existing-pr.outputs.number == ''
        env:
          GH_TOKEN: ${{ steps.monorepo-app-token.outputs.token }}
          PROJECT: ${{ inputs.project }}
          SOURCE_REPOSITORY: ${{ steps.project.outputs.source_repository }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          IMPORT_BRANCH: ${{ steps.import.outputs.branch_name }}
          SOURCE_SHA: ${{ steps.import.outputs.source_sha }}
        run: |
          cat > /tmp/import-pr-body.md <<EOF
          ## Summary
          - sync accepted public repo changes from ${SOURCE_REPOSITORY}
          - source branch: ${SOURCE_BRANCH}
          - source commit: ${SOURCE_SHA}

          This PR syncs the public repository tree back into the monorepo path after review in the public repo.
          EOF

          gh pr create \
            --base main \
            --head "$IMPORT_BRANCH" \
            --title "import ${PROJECT} from ${SOURCE_REPOSITORY}" \
            --body-file /tmp/import-pr-body.md

      - name: Update existing pull request
        if: steps.import.outputs.changed == 'true' && steps.existing-pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.monorepo-app-token.outputs.token }}
          PR_NUMBER: ${{ steps.existing-pr.outputs.number }}
          SOURCE_REPOSITORY: ${{ steps.project.outputs.source_repository }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_SHA: ${{ steps.import.outputs.source_sha }}
        run: |
          gh pr comment "$PR_NUMBER" --body "Updated import branch from ${SOURCE_REPOSITORY}:${SOURCE_BRANCH} at ${SOURCE_SHA}."

name: Publish Outputs Action

on:
  push:
    branches:
      - main
    paths:
      - "actions/outputs-action/**"
      - ".github/workflows/publish-outputs-action.yml"
      - "scripts/check-project-sync.sh"
      - "scripts/export-project.sh"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the standalone tree sync without pushing"
        required: false
        type: boolean
        default: true

jobs:
  publish:
    name: Publish outputs-action
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: publish-outputs-action-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Check out monorepo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create source repo GitHub App token
        id: app-token
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.YAFFLE_INTERNAL_GH_APP_ID }}
          private-key: ${{ secrets.YAFFLE_INTERNAL_GH_APP_PRIVATE_KEY }}
          owner: yaffle-dot-dev
          repositories: outputs-action

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Sync outputs-action to public repo
        env:
          PROJECT: outputs-action
          SOURCE_PATH: actions/outputs-action
          TARGET_REPOSITORY: yaffle-dot-dev/outputs-action
          TARGET_BRANCH: main
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          PUBLISH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash scripts/export-project.sh

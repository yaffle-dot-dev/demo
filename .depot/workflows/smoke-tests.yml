name: Smoke Tests

on:
  pull_request:
    paths:
      - "apps/control-plane/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".depot/workflows/smoke-tests.yml"
  push:
    branches: [main]
    paths:
      - "apps/control-plane/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".depot/workflows/smoke-tests.yml"

permissions:
  contents: read

concurrency:
  group: smoke-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Run smoke tests
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: yaffle
          POSTGRES_PASSWORD: yaffle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yaffle -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://yaffle:yaffle@127.0.0.1:5432/yaffle_dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run smoke suite
        run: pnpm run smoke

      - name: Summary
        run: |
          echo "## Smoke tests passed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- command: \`pnpm run smoke\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- database: postgres service container" >> "$GITHUB_STEP_SUMMARY"

  browser-smoke:
    name: Run browser smoke tests
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run browser smoke suite
        run: pnpm run smoke:browser

      - name: Summary
        run: |
          echo "## Browser smoke tests passed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- command: \`pnpm run smoke:browser\`" >> "$GITHUB_STEP_SUMMARY"

name: Smoke Tests

on:
  pull_request:
    paths:
      - "apps/control-plane/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "apps/control-plane/bunfig.toml"
      - ".depot/workflows/smoke-tests.yml"
  push:
    branches: [main]
    paths:
      - "apps/control-plane/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "apps/control-plane/bunfig.toml"
      - ".depot/workflows/smoke-tests.yml"

permissions:
  contents: read

concurrency:
  group: smoke-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Run smoke tests
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: yaffle
          POSTGRES_PASSWORD: yaffle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yaffle -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://yaffle:yaffle@127.0.0.1:5432/yaffle_dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run smoke suite
        run: bun run smoke

      - name: Summary
        run: |
          echo "## Smoke tests passed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- command: \`bun run smoke\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- database: postgres service container" >> "$GITHUB_STEP_SUMMARY"

  browser-smoke:
    name: Run browser smoke tests
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run browser smoke suite
        run: bun run smoke:browser

      - name: Summary
        run: |
          echo "## Browser smoke tests passed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- command: \`bun run smoke:browser\`" >> "$GITHUB_STEP_SUMMARY"

# Depot CI Migration
# Source: .github/workflows/deploy-provider-discovery-agent.yml
#
# No changes were necessary.

name: Deploy Provider Discovery Agent
on:
  push:
    branches: [main]
    paths:
      - "apps/provider-discovery-agent/**"
      - "infra/shared/**"
      - "actions/outputs-action/**"
      - ".github/workflows/deploy-provider-discovery-agent.yml"
  pull_request:
    paths:
      - "apps/provider-discovery-agent/**"
      - "infra/shared/**"
      - "actions/outputs-action/**"
      - ".github/workflows/deploy-provider-discovery-agent.yml"
permissions:
  contents: read
  id-token: write
env:
  AWS_REGION: us-east-1
  YAFFLE_CI_ROLE_ARN: arn:aws:iam::870923192739:role/yaffle-depot-ci
  TAILSCALE_GITHUB_ACTIONS_SECRET_ID: yaffle/shared/tailscale/github-actions-oauth
  DEFAULT_YAFFLE_API_URL: http://yaffle.tail66f312.ts.net:3000
  DEFAULT_TAILSCALE_PING_TARGET: yaffle.tail66f312.ts.net
  GITHUB_ACTION: true
  
jobs:
  deploy:
    name: Deploy provider discovery agent
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Debug OIDC env
        run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL: ${ACTIONS_ID_TOKEN_REQUEST_URL:-(not set)}"
          echo "ACTIONS_RUNTIME_TOKEN length: ${#ACTIONS_RUNTIME_TOKEN}"
          env | grep -i depot || true
      - name: Configure AWS credentials (bootstrap)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.YAFFLE_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Fetch Tailscale CI OAuth credentials
        id: tailscale-bootstrap
        run: |
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "${TAILSCALE_GITHUB_ACTIONS_SECRET_ID}" \
            --query SecretString \
            --output text)

          OAUTH_SECRET=$(printf '%s' "$SECRET_JSON" | jq -r '.oauth_secret')
          echo "::add-mask::${OAUTH_SECRET}"
          echo "oauth-client-id=$(printf '%s' "$SECRET_JSON" | jq -r '.oauth_client_id')" >> "$GITHUB_OUTPUT"
          echo "oauth-secret=${OAUTH_SECRET}" >> "$GITHUB_OUTPUT"
      
      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ steps.tailscale-bootstrap.outputs.oauth-client-id }}
          oauth-secret: ${{ steps.tailscale-bootstrap.outputs.oauth-secret }}
          tags: tag:github-actions-ci
          ping: ${{ env.DEFAULT_TAILSCALE_PING_TARGET }}
          version: latest
          args: '--accept-dns'

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Load Yaffle API token from Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            YAFFLE_API_TOKEN, yaffle/shared/github-actions/yaffle-api-token
          parse-json-secrets: false
      - name: Typecheck provider discovery agent
        run: bun run --filter=@yaffle/provider-discovery-agent typecheck
      - name: Run provider discovery agent tests
        env:
          YAFFLE_SKIP_TEST_DB_SETUP: "true"
        run: bun test apps/provider-discovery-agent/src/provider-research.test.ts apps/provider-discovery-agent/src/provider-llm.test.ts apps/provider-discovery-agent/src/signing.test.ts
      - name: Wait for provider discovery infrastructure
        uses: ./actions/outputs-action
        id: infra
        with:
          api-url: ${{ env.DEFAULT_YAFFLE_API_URL }}
          workspace: apps/provider-discovery-agent/infra
          wait: true
          wait-timeout: 600
      - name: Generate Wrangler deploy config
        working-directory: apps/provider-discovery-agent
        env:
          WORKER_NAME: ${{ steps.infra.outputs.worker_name }}
          WORKER_ROUTE_PATTERN: ${{ steps.infra.outputs.worker_route_pattern }}
        run: |
          cat > wrangler.ci.toml <<EOF
          name = "${WORKER_NAME}"
          main = "src/index.ts"
          compatibility_date = "2026-03-23"
          compatibility_flags = ["nodejs_compat"]

          [observability]
          enabled = true

          [observability.logs]
          enabled = true
          invocation_logs = true

          [ai]
          binding = "AI"

          [[durable_objects.bindings]]
          name = "ProviderDiscoveryAgent"
          class_name = "ProviderDiscoveryAgent"

          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["ProviderDiscoveryAgent"]

          [[routes]]
          pattern = "${WORKER_ROUTE_PATTERN}"
          zone_name = "yaffle.dev"

          [vars]
          YAFFLE_PROVIDER_DISCOVERY_CALLBACK_TIMEOUT_MS = "8000"
          YAFFLE_PROVIDER_DISCOVERY_MAX_DOCS = "24"
          YAFFLE_PROVIDER_DISCOVERY_AI_MODEL = "@cf/zai-org/glm-4.7-flash"
          YAFFLE_PROVIDER_DISCOVERY_AI_GATEWAY_ID = "${{ steps.infra.outputs.ai_gateway_id }}"
          EOF
      - name: Load deploy and runtime secrets from Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            CLOUDFLARE_ACCOUNT_ID, ${{ steps.infra.outputs.cloudflare_account_id_secret_id }}
            CLOUDFLARE_API_TOKEN, ${{ steps.infra.outputs.cloudflare_api_token_secret_id }}
            YAFFLE_PROVIDER_DISCOVERY_AGENT_TOKEN, ${{ steps.infra.outputs.agent_token_secret_id }}
            YAFFLE_PROVIDER_DISCOVERY_CALLBACK_SECRET, ${{ steps.infra.outputs.callback_secret_secret_id }}
            YAFFLE_PROVIDER_DISCOVERY_AI_GATEWAY_TOKEN, ${{ steps.infra.outputs.ai_gateway_token_secret_id }}
          parse-json-secrets: false
      - name: Load optional GitHub research token from Secrets Manager
        continue-on-error: true
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            GITHUB_TOKEN, ${{ steps.infra.outputs.github_token_secret_id }}
          parse-json-secrets: false
      - name: Upload worker runtime secrets
        working-directory: apps/provider-discovery-agent
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          YAFFLE_PROVIDER_DISCOVERY_AGENT_TOKEN: ${{ env.YAFFLE_PROVIDER_DISCOVERY_AGENT_TOKEN }}
          YAFFLE_PROVIDER_DISCOVERY_CALLBACK_SECRET: ${{ env.YAFFLE_PROVIDER_DISCOVERY_CALLBACK_SECRET }}
          YAFFLE_PROVIDER_DISCOVERY_AI_GATEWAY_TOKEN: ${{ env.YAFFLE_PROVIDER_DISCOVERY_AI_GATEWAY_TOKEN }}
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
        run: |
          jq -n \
            --arg cloudflareAccountId "$CLOUDFLARE_ACCOUNT_ID" \
            --arg agentToken "$YAFFLE_PROVIDER_DISCOVERY_AGENT_TOKEN" \
            --arg callbackSecret "$YAFFLE_PROVIDER_DISCOVERY_CALLBACK_SECRET" \
            --arg aiGatewayToken "$YAFFLE_PROVIDER_DISCOVERY_AI_GATEWAY_TOKEN" \
            --arg githubToken "$GITHUB_TOKEN" \
            '{
              CLOUDFLARE_ACCOUNT_ID: $cloudflareAccountId,
              YAFFLE_PROVIDER_DISCOVERY_AGENT_TOKEN: $agentToken,
              YAFFLE_PROVIDER_DISCOVERY_CALLBACK_SECRET: $callbackSecret,
              YAFFLE_PROVIDER_DISCOVERY_AI_GATEWAY_TOKEN: $aiGatewayToken,
              GITHUB_TOKEN: $githubToken
            }' > wrangler.secrets.json

          bunx wrangler secret bulk wrangler.secrets.json --config wrangler.ci.toml
      - name: Deploy worker
        working-directory: apps/provider-discovery-agent
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy --config wrangler.ci.toml
      - name: Smoke test worker health endpoint
        run: |
          HEALTH_URL="${{ steps.infra.outputs.worker_url }}/health"
          echo "Checking worker health at ${HEALTH_URL}"

          for attempt in $(seq 1 36); do
            status=$(curl --silent --show-error --output /tmp/worker-health.json --write-out "%{http_code}" "$HEALTH_URL" || true)

            if [ "$status" = "200" ]; then
              cat /tmp/worker-health.json
              exit 0
            fi

            echo "Health check attempt ${attempt}/36 returned HTTP ${status}" >&2

            if [ "$attempt" -eq 36 ]; then
              echo "Worker health check failed after retries" >&2
              echo "Last response body:" >&2
              cat /tmp/worker-health.json >&2 || true
              exit 1
            fi

            sleep 10
          done
      - name: Smoke test real provider discovery
        env:
          WORKER_URL: ${{ steps.infra.outputs.worker_url }}
          AGENT_TOKEN: ${{ env.YAFFLE_PROVIDER_DISCOVERY_AGENT_TOKEN }}
        run: |
          DISCOVERY_PROVIDER="hashicorp/tfe"

          echo "Dispatching real discovery for ${DISCOVERY_PROVIDER}"

          curl --fail --silent --show-error \
            -X POST "${WORKER_URL}/discover/direct" \
            -H "Authorization: Bearer ${AGENT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg requestId "00000000-0000-0000-0000-000000000001" \
              --arg providerType "$DISCOVERY_PROVIDER" \
              '{
                requestId: $requestId,
                providerType: $providerType,
                callbackUrl: "https://example.invalid/callback",
                callbackAuth: { mode: "hmac-sha256" },
                callbackTtlSeconds: 600
              }')" > /tmp/provider-discovery-dispatch.json

          cat /tmp/provider-discovery-dispatch.json | jq '.'

          jq -e '.data.status == "succeeded"' /tmp/provider-discovery-dispatch.json >/dev/null
          jq -e '.data.exactEnvVars | index("TFE_TOKEN")' /tmp/provider-discovery-dispatch.json >/dev/null
          jq -e '.data.prefixEnvVars | index("TFE_")' /tmp/provider-discovery-dispatch.json >/dev/null

          echo "Provider discovery smoke test passed"
      - name: Summary
        run: |
          echo "## Provider discovery agent deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Environment:** ${{ steps.infra.outputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Worker:** ${{ steps.infra.outputs.worker_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** ${{ steps.infra.outputs.worker_url }}" >> "$GITHUB_STEP_SUMMARY"

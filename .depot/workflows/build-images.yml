          - sequential:
              # -----------------------------------------------------------------
              # Update runner task definition
              # -----------------------------------------------------------------
              # Runner is ephemeral (no service) — just register a new revision.
              # The control plane uses the family name to RunTask, picking up
              # the latest revision automatically.

              - name: Download runner task definition
                run: |
                  aws ecs describe-task-definition \
                    --task-definition yaffle-runner-main-use1 \
                    --query 'taskDefinition' \
                    --output json | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
                    > runner-task-definition.json

              - name: Render runner image
                id: render-runner
                uses: aws-actions/amazon-ecs-render-task-definition@v1
                with:
                  task-definition: runner-task-definition.json
                  container-name: runner
                  image: 870923192739.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/yaffle-runner-production:sha-${{ github.sha }}

              - name: Register runner task definition
                uses: aws-actions/amazon-ecs-deploy-task-definition@v2
                with:
                  task-definition: ${{ steps.render-runner.outputs.task-definition }}

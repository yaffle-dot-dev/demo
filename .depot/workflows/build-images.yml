# Depot CI Migration
# Source: .github/workflows/build-images.yml
#
# No changes were necessary.

name: Build Container Images
on:
  push:
    branches: [main]
    paths:
      - "apps/control-plane/**"
      - "!apps/control-plane/infra/**"
      - "apps/runner/**"
      - "!apps/runner/infra/**"
      - "packages/**"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/build-images.yml"
  pull_request:
    paths:
      - "apps/control-plane/**"
      - "!apps/control-plane/infra/**"
      - "apps/runner/**"
      - "!apps/runner/infra/**"
      - "packages/**"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/build-images.yml"
permissions:
  contents: read
  id-token: write
env:
  AWS_REGION: us-east-1
  GITHUB_ACTION: true
  
jobs:
  build:
    name: Build Images
    runs-on: depot-ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Determine tier
        id: tier
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tier=production" >> $GITHUB_OUTPUT
            echo "push=true" >> $GITHUB_OUTPUT
          else
            echo "tier=nonprod" >> $GITHUB_OUTPUT
            echo "push=false" >> $GITHUB_OUTPUT
          fi
      - name: Configure AWS credentials
        if: steps.tier.outputs.push == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::870923192739:role/yaffle-github-actions-ci
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        if: steps.tier.outputs.push == 'true'
        id: ecr-login
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            skopeo login --username AWS --password-stdin \
            870923192739.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          echo "registry=870923192739.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> $GITHUB_OUTPUT
      # Build JavaScript with Bun (outside nix sandbox)
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build control-plane bundle
        run: |
          mkdir -p dist/control-plane/node_modules

          # Bundle the control-plane
          # --external minijinja-js: WASM module that doesn't bundle correctly
          bun build apps/control-plane/src/index.ts \
            --outdir dist/control-plane \
            --target bun \
            --external minijinja-js

          # Copy runtime dependencies that can't be bundled
          cp -r node_modules/.bun/minijinja-js@*/node_modules/minijinja-js dist/control-plane/node_modules/
      # Package with nix2container
      # --impure allows reading YAFFLE_BUNDLE_PATH env var
      - name: Build control-plane image
        run: |
          export YAFFLE_BUNDLE_PATH="${{ github.workspace }}/dist/control-plane"
          nix build .#control-plane-image --impure -L -o result-control-plane
          # Also build the copyToRegistry to get access to nix2container's skopeo
          nix build .#control-plane-image.copyToRegistry --impure -o copy-control-plane
      - name: Push control-plane image
        if: steps.tier.outputs.push == 'true'
        run: |
          TIER="${{ steps.tier.outputs.tier }}"
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"

          # Get the image JSON path
          IMAGE_JSON=$(readlink -f result-control-plane)

          # Extract and set PATH from the copyToRegistry script (includes nix2container's skopeo)
          eval $(grep '^export PATH=' copy-control-plane/bin/copy-to-registry)

          # Push with SHA tag using nix2container's skopeo (has nix transport)
          skopeo --insecure-policy copy \
            nix:${IMAGE_JSON} \
            docker://${REGISTRY}/yaffle-control-plane-${TIER}:sha-${SHORT_SHA}

          # Push latest tag
          skopeo --insecure-policy copy \
            nix:${IMAGE_JSON} \
            docker://${REGISTRY}/yaffle-control-plane-${TIER}:latest
      - name: Build runner image
        run: |
          nix build .#runner-image -L -o result-runner
          nix build .#runner-image.copyToRegistry -o copy-runner
      - name: Push runner image
        if: steps.tier.outputs.push == 'true'
        run: |
          TIER="${{ steps.tier.outputs.tier }}"
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"

          # Get the image JSON path
          IMAGE_JSON=$(readlink -f result-runner)

          # Extract and set PATH from the copyToRegistry script (includes nix2container's skopeo)
          eval $(grep '^export PATH=' copy-runner/bin/copy-to-registry)

          # Push with SHA tag using nix2container's skopeo (has nix transport)
          skopeo --insecure-policy copy \
            nix:${IMAGE_JSON} \
            docker://${REGISTRY}/yaffle-runner-${TIER}:sha-${SHORT_SHA}

          # Push latest tag
          skopeo --insecure-policy copy \
            nix:${IMAGE_JSON} \
            docker://${REGISTRY}/yaffle-runner-${TIER}:latest
      - name: Summary
        run: |
          echo "## Container Images Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.tier.outputs.push }}" = "true" ]; then
            TIER="${{ steps.tier.outputs.tier }}"
            REGISTRY="${{ steps.ecr-login.outputs.registry }}"
            SHORT_SHA="${{ github.sha }}"
            SHORT_SHA="${SHORT_SHA:0:7}"
            echo "**Registry:** ${REGISTRY}" >> $GITHUB_STEP_SUMMARY
            echo "**Tier:** ${TIER}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Images Pushed" >> $GITHUB_STEP_SUMMARY
            echo "- \`yaffle-control-plane-${TIER}:sha-${SHORT_SHA}\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`yaffle-control-plane-${TIER}:latest\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`yaffle-runner-${TIER}:sha-${SHORT_SHA}\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`yaffle-runner-${TIER}:latest\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "Images built but not pushed (PR build)" >> $GITHUB_STEP_SUMMARY
          fi

name: Build Container Images
# on:
#   push:
#     branches: [main]
#     paths:
#       - "apps/control-plane/**"
#       - "!apps/control-plane/infra/**"
#       - "apps/web/**"
#       - "!apps/web/infra/**"
#       - "apps/runner/**"
#       - "!apps/runner/infra/**"
#       - "packages/**"
#       - ".depot/workflows/build-images.yml"
#   pull_request:
#     paths:
#       - "apps/control-plane/**"
#       - "!apps/control-plane/infra/**"
#       - "apps/web/**"
#       - "!apps/web/infra/**"
#       - "apps/runner/**"
#       - "!apps/runner/infra/**"
#       - "packages/**"
#       - ".depot/workflows/build-images.yml"
permissions:
  contents: read
  id-token: write
env:
  AWS_REGION: us-east-1
  REGISTRY: 870923192739.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build:
    name: Build Images
    runs-on: depot-ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Depot CLI
        uses: depot/setup-action@v1

      - name: Determine tier
        id: tier
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tier=production" >> $GITHUB_OUTPUT
            echo "push=true" >> $GITHUB_OUTPUT
          else
            echo "tier=nonprod" >> $GITHUB_OUTPUT
            echo "push=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        if: steps.tier.outputs.push == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::870923192739:role/yaffle-depot-ci
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: steps.tier.outputs.push == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: tags
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          TIER="${{ steps.tier.outputs.tier }}"
          echo "cp_image=${{ env.REGISTRY }}/yaffle-control-plane-${TIER}" >> $GITHUB_OUTPUT
          echo "web_image=${{ env.REGISTRY }}/yaffle-web-${TIER}" >> $GITHUB_OUTPUT
          echo "runner_image=${{ env.REGISTRY }}/yaffle-runner-${TIER}" >> $GITHUB_OUTPUT
          echo "sha_tag=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
      
      - parallel:
        - name: Build control-plane image
          run: |
            if [ "${{ steps.tier.outputs.push }}" = "true" ]; then
              depot build -f apps/control-plane/Dockerfile --platform linux/arm64 --push \
                -t ${{ steps.tags.outputs.cp_image }}:${{ steps.tags.outputs.sha_tag }} \
                -t ${{ steps.tags.outputs.cp_image }}:latest \
                .
            else
              depot build -f apps/control-plane/Dockerfile --platform linux/arm64 .
            fi

        - name: Build web image
          run: |
            if [ "${{ steps.tier.outputs.push }}" = "true" ]; then
              depot build -f apps/web/Dockerfile --platform linux/arm64 --push \
                -t ${{ steps.tags.outputs.web_image }}:${{ steps.tags.outputs.sha_tag }} \
                -t ${{ steps.tags.outputs.web_image }}:latest \
                .
            else
              depot build -f apps/web/Dockerfile --platform linux/arm64 .
            fi

        - name: Build runner image
          run: |
            if [ "${{ steps.tier.outputs.push }}" = "true" ]; then
              depot build -f apps/runner/Dockerfile --platform linux/arm64 --push \
                -t ${{ steps.tags.outputs.runner_image }}:${{ steps.tags.outputs.sha_tag }} \
                -t ${{ steps.tags.outputs.runner_image }}:latest \
                .
            else
              depot build -f apps/runner/Dockerfile --platform linux/arm64 .
            fi

      - name: Summary
        run: |
          echo "## Container Images Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.tier.outputs.push }}" = "true" ]; then
            echo "**Registry:** ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
            echo "**Tier:** ${{ steps.tier.outputs.tier }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Images Pushed" >> $GITHUB_STEP_SUMMARY
            echo "- \`yaffle-control-plane-${{ steps.tier.outputs.tier }}:${{ steps.tags.outputs.sha_tag }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`yaffle-control-plane-${{ steps.tier.outputs.tier }}:latest\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`yaffle-web-${{ steps.tier.outputs.tier }}:${{ steps.tags.outputs.sha_tag }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`yaffle-web-${{ steps.tier.outputs.tier }}:latest\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`yaffle-runner-${{ steps.tier.outputs.tier }}:${{ steps.tags.outputs.sha_tag }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`yaffle-runner-${{ steps.tier.outputs.tier }}:latest\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "Images built but not pushed (PR build)" >> $GITHUB_STEP_SUMMARY
          fi

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: depot-ubuntu-24.04-arm
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::870923192739:role/yaffle-depot-ci
          aws-region: ${{ env.AWS_REGION }}

      # -----------------------------------------------------------------
      # Database migrations
      # -----------------------------------------------------------------

      - name: Fetch database credentials
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            DATABASE_URL, yaffle/main/database-url
          parse-json-secrets: false

      - name: Run database migrations
        run: cd apps/control-plane && bunx drizzle-kit migrate

      # -----------------------------------------------------------------
      # Deploy control plane
      # -----------------------------------------------------------------

      - name: Download control-plane task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition yaffle-cp-main-use1 \
            --query 'taskDefinition' \
            --output json | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            > cp-task-definition.json

      - name: Render control-plane image
        id: render-cp
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: cp-task-definition.json
          container-name: control-plane
          image: 870923192739.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/yaffle-control-plane-production:sha-${{ github.sha }}

      - name: Deploy control plane
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-cp.outputs.task-definition }}
          service: yaffle-cp-main-use1
          cluster: yaffle-production-use1
          wait-for-service-stability: true

      # -----------------------------------------------------------------
      # Deploy web app
      # -----------------------------------------------------------------

      - name: Download web task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition yaffle-web-main-use1 \
            --query 'taskDefinition' \
            --output json | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            > web-task-definition.json

      - name: Render web image
        id: render-web
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: web-task-definition.json
          container-name: web
          image: 870923192739.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/yaffle-web-production:sha-${{ github.sha }}

      - name: Deploy web app
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-web.outputs.task-definition }}
          service: yaffle-web-main-use1
          cluster: yaffle-production-use1
          wait-for-service-stability: true

inputs:
  mk-shell-bin:
    url: github:rrbutani/nix-mk-shell-bin
  nix2container:
    url: github:nlewo/nix2container
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
 
# Native secretspec integration - loads secrets from 1Password for development
# Secrets are defined in secretspec.toml and loaded into the shell environment
# Can be overridden via CLI: devenv --secretspec-provider dotenv --secretspec-profile test shell
secretspec:
  enable: true
  provider: onepassword://yaffle.dev
  profile: development

[workspace]
members = [
  "crates/yaffle-cli",
  "crates/yaffle-contracts",
  "crates/yaffle-config",
  "crates/yaffle-engine",
  "crates/yaffle-graph",
  "crates/yaffle-tofu",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/yaffle-dot-dev/yaffle"
homepage = "https://yaffle.dev"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.39", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.12"
toml = "0.8.23"
